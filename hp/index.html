<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>HUFS 건물 찾기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; height: 100vh; }
    .search-box { padding: 15px; background: #002b5c; color: white; display: flex; gap: 10px; }
    .search-box input { flex: 1; padding: 10px; border-radius: 4px; border: none; font-size: 16px; outline: none; }
    .search-box button { padding: 10px 20px; background: #f1c40f; color: #002b5c; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    #map { flex: 1; width: 100%; }
    .info-window { padding: 10px; font-size: 14px; color: #333; line-height: 1.4; }
  </style>
  <!-- TODO (Person A): 카카오 디벨로퍼스에서 발급받은 JS API 키를 아래 appkey= 뒤에 넣으세요 -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_API_KEY_HERE"></script>
</head>
<body>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="건물명이나 별칭을 검색하세요 (예: 미콤)">
    <button id="searchBtn">검색</button>
  </div>
  <div id="map"></div>
  <script src="map.js"></script>
</body>
</html>
