<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=hp/">
  <script>location.replace("hp/");</script>
  <title>BookLink Admin</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f3f4f6;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .redirect-box {
      text-align: center;
      padding: 40px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0F9D58;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 10px;
    }
    .link-wrap {
      margin-top: 15px;
    }
    a {
      color: #0F9D58;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner"></div>
    <div class="title">BookLink Admin 콘솔로 이동 중입니다...</div>
    <div class="link-wrap"><a href="hp/">이동이 지연될 경우 여기를 클릭하세요.</a></div>
  </div>
</body>
</html>
