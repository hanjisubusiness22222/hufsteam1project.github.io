<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=hp/">
  <script>location.replace("hp/");</script>
  <title>HUFS 스마트 캠퍼스 길찾기</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #002c5f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .redirect-box {
      text-align: center;
      padding: 30px;
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #c5a059;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      color: #c5a059;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner"></div>
    <div style="font-size: 1.1rem; font-weight: 600; margin-bottom: 8px;">HUFS 캠퍼스 맵으로 이동 중...</div>
    <div><a href="hp/">이동이 지연될 경우 여기를 클릭하세요.</a></div>
  </div>
</body>
</html>
